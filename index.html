<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>I Can Be a Builder!</title>
<meta name="theme-color" content="#ff8a1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Builder">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap">
<style>
  /* Layout: one story page at a time. A square picture (SVG scene) fills the stage; the caption and ◀ 🔊 ▶ panel sit below it, or beside it on wide screens. */
  :root{
    --sky:#9ad9ff; --orange:#ff8a1f; --yellow:#ffcc00; --ink:#2a2140; --cream:#fff7e6; --green:#43b05c;
    --title:'Luckiest Guy','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
    --read:Verdana,Tahoma,sans-serif;
    --btn:clamp(56px, 14vmin, 84px);
    color-scheme: light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--orange);color:var(--ink);
    touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}

  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #stage{position:relative;flex:1 1 auto;min-height:0;min-width:0;overflow:hidden;background:var(--sky)}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  #mute{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));
    width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.75);font-size:24px;line-height:48px;padding:0}

  /* ---------- caption panel ---------- */
  #panel{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:var(--cream);border-top:6px solid var(--orange);
    padding:10px calc(14px + env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}
  #dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  #dots i{width:9px;height:9px;border-radius:50%;background:#e4d3b4}
  #dots i.seen{background:#f5b26b}
  #dots i.now{background:var(--orange);transform:scale(1.5)}
  #cap{margin:0;max-width:34em;min-height:2.6em;display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:var(--read);font-weight:bold;font-size:clamp(18px, 4.6vmin, 30px);line-height:1.3}
  #nav{display:flex;gap:clamp(14px, 4vmin, 28px);align-items:center}
  #nav button{width:var(--btn);height:var(--btn);border-radius:50%;display:grid;place-items:center;padding:0;
    background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .1s}
  #nav button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  #nav svg{width:52%;height:52%}
  #nav button:disabled{opacity:.3;cursor:default}
  #next{background:var(--green)!important;color:#fff}
  #next .again{display:none}
  #next.last .go{display:none}
  #next.last .again{display:block}
  #next.ready{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.14);box-shadow:0 0 0 10px rgba(67,176,92,.25)}}
  #hear{font-size:calc(var(--btn) * .42)}

  /* wide, short screens (tablet or phone held sideways): picture left, panel right */
  @media (min-aspect-ratio: 5/4){
    #app{flex-direction:row}
    #panel{width:clamp(230px, 32vw, 400px);border-top:0;border-left:6px solid var(--orange);gap:clamp(10px, 4vh, 28px)}
    #cap{font-size:clamp(18px, 3.4vw, 30px)}
  }

  /* ---------- start screen ---------- */
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:rgba(42,33,64,.35)}
  #go{width:clamp(120px, 30vmin, 180px);height:clamp(120px, 30vmin, 180px);border-radius:50%;background:var(--green);
    box-shadow:0 8px 0 #2e7d43, 0 0 0 10px rgba(255,255,255,.6);display:grid;place-items:center;animation:pulse 1.2s ease-in-out infinite}
  #go svg{width:46%;height:46%;margin-left:8%}
  #start p{margin:0;font-family:var(--title);font-size:clamp(28px, 7vmin, 44px);color:#fff;letter-spacing:1px;
    text-shadow:0 3px 0 var(--ink), 0 0 12px rgba(0,0,0,.4)}

  /* ---------- scene pieces ---------- */
  .title{font-family:var(--title);fill:var(--yellow);stroke:var(--ink);stroke-width:9px;paint-order:stroke;stroke-linejoin:round}
  .tap{cursor:pointer}
  .a{transform-box:fill-box;transform-origin:50% 100%}
  .mid{transform-origin:50% 50%}
  .bounce{animation:bounce .6s ease-out}
  @keyframes bounce{25%{transform:scale(1.08,.9)}55%{transform:translateY(-10%) scale(.96,1.06)}80%{transform:translateY(0) scale(1.03,.97)}}
  .wiggle{animation:wiggle .6s ease-in-out}
  @keyframes wiggle{20%{transform:rotate(-12deg) scale(1.12)}45%{transform:rotate(10deg) scale(1.12)}70%{transform:rotate(-6deg) scale(1.06)}}
  .popin{animation:popin .55s cubic-bezier(.3,1.6,.5,1) backwards}
  @keyframes popin{from{transform:scale(0)}}
  .drop{animation:drop .45s cubic-bezier(.5,0,.8,.6) backwards}
  @keyframes drop{from{transform:translateY(-320px)}}
  .shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-6%)}50%{transform:translateX(6%)}75%{transform:translateX(-3%)}}
  .arm{transform-box:fill-box;transform-origin:8% 92%}
  .waving .arm{animation:wave .32s ease-in-out 6 alternate}
  @keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
  .spark{transform-box:fill-box;transform-origin:50% 50%;animation:spark .8s ease-out forwards}
  @keyframes spark{0%{transform:scale(0)}50%{transform:scale(1.4)}100%{transform:scale(.4);opacity:0}}
  .float{animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px)}}
  .flow{stroke-dasharray:10 8;animation:flow .4s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-18}}
  .glow{transition:opacity .4s}
  #paint{transition:fill .5s}
  .panelcard{transition:stroke .3s, stroke-width .3s}
  .panelcard.on{stroke:var(--orange);stroke-width:9px}
  .conf{position:absolute;top:-24px;width:11px;height:17px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(115vh) rotate(800deg)}}
  @media (prefers-reduced-motion: reduce){ #next.ready, #go{animation:none} }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <svg id="scene" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Story picture"></svg>
    <div id="fx"></div>
    <button id="mute" aria-label="Sound on or off">🔈</button>
  </div>
  <div id="panel">
    <div id="dots" aria-hidden="true"></div>
    <p id="cap" aria-live="polite"></p>
    <div id="nav">
      <button id="prev" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 4 L7 12 L15 20" fill="none" stroke="#2a2140" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="hear" aria-label="Hear it again">🔊</button>
      <button id="next" aria-label="Next">
        <svg class="go" viewBox="0 0 24 24"><path d="M9 4 L17 12 L9 20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="again" viewBox="0 0 24 24"><path d="M19 12 A7 7 0 1 1 16 6.3" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><path d="M12 3 L17 6 L13 10" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>
<div id="start">
  <button id="go" aria-label="Start"><svg viewBox="0 0 24 24"><path d="M5 3 L21 12 L5 21 Z" fill="#fff"/></svg></button>
  <p>Tap to start!</p>
</div>

<script>
/* ============================================================
   Tuning knobs
   ============================================================ */
const ASSET_V = 1;            // bump after replacing any file in assets/
const DIG_TAPS = 5;           // taps on the digger before the hole is finished
const POUR_TAPS = 3;          // taps on the cement mixer before the hole is full
const BRICKS = 10;            // bricks in the wall, counted aloud (there are clips for one to ten)
const BRICK_GAP = 450;        // ms: the soonest a new brick can follow the last one
const QUIZ_PAUSE = 700;       // ms between a quiz answer's praise and the next question
const COLOURS = { red: '#e53935', blue: '#1e88e5', yellow: '#fdd835', green: '#43a047', pink: '#f06292', purple: '#8e5bd6' };

/* ============================================================
   The story's words. Each key has a clip assets/say-<key>.mp3;
   the text is the caption and the fallback for the device voice.
   ============================================================ */
const LINES = {
  p1: 'Hi! I am Sam. I want to be a builder!', hello: 'Hello, friend!',
  p2: 'Builders make houses. Builders make schools. Builders make tall towers!',
  house: 'A house!', school: 'A school!', tower: 'A tall tower!',
  p3: 'A builder must be safe. Help me get dressed!',
  hat: 'My hard hat keeps my head safe.', vest: 'My vest is bright. You can see me!', boots: 'Big boots keep my feet safe.',
  gloves: 'Gloves keep my hands safe.', goggles: 'Goggles keep my eyes safe.', ready: 'I am ready!',
  p4: 'These are my tools.',
  hammer: 'Hammer! Bang, bang!', saw: 'Saw! Zzz, zzz!', tape: 'Tape measure! How long is it?', drill: 'Drill! Brrrrr!', level: 'Level! Is it flat?',
  p5: 'Builders use big machines!', digger: 'Digger!', mixer: 'Cement mixer!', truck: 'Dump truck!', crane: 'Crane!',
  p6: 'First, we dig a big hole.', p6done: 'What a big hole!',
  p7: 'Next, we pour concrete. It is hard and flat.', p7done: 'Nice and flat!',
  p8: "Now we stack bricks. Let's count!",
  n1: 'One!', n2: 'Two!', n3: 'Three!', n4: 'Four!', n5: 'Five!', n6: 'Six!', n7: 'Seven!', n8: 'Eight!', n9: 'Nine!', n10: 'Ten!',
  p8done: 'Ten bricks! Great job!',
  p9: 'The crane lifts the roof. Up, up, up!', p9done: 'The roof is on!',
  p10: 'We add windows and a door. Pick a colour!',
  red: 'Red!', blue: 'Blue!', yellow: 'Yellow!', green: 'Green!', pink: 'Pink!', purple: 'Purple!',
  p11: 'Builders work as a team.',
  electrician: 'I am an electrician. Lights on!', plumber: 'I am a plumber. Water on!', painter: "I am a painter. Let's add flowers!",
  p12: 'Is it safe? Thumbs up, or thumbs down?',
  q1: 'Wear a hard hat?', q2: 'Run under the crane?', q3: 'Wear gloves?', q4: 'Climb up high with no help?',
  yes: 'Yes! That is safe!', no: 'Right! That is not safe.', oops: 'Oops! Try again.',
  p13a: 'Play with blocks. Learn to count and measure.', p13b: 'Be careful, and help others.',
  p13c: 'When you are big, go to builder school. A builder teacher shows you how!',
  p14: 'We built a house! You can be a builder too!', badge: 'You are a Junior Builder!',
};
const SFX = ['hammer', 'saw', 'drill', 'digger', 'pour', 'honk', 'crane', 'brick', 'roof', 'click', 'water', 'cheer'];

/* ============================================================
   Helpers
   ============================================================ */
const $ = (s) => document.querySelector(s);
const scene = $('#scene'), cap = $('#cap'), nextBtn = $('#next'), prevBtn = $('#prev');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = (t) => 1 - (1 - t) ** 3;
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
const store = {
  get(k, d) { try { const v = localStorage.getItem('builder.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('builder.' + k, JSON.stringify(v)); } catch {} },
};
let pageCtl = new AbortController();   // listeners added with on() are dropped when the page changes
const on = (el, ev, fn) => el.addEventListener(ev, fn, { signal: pageCtl.signal });
function put(svg) { scene.insertAdjacentHTML('beforeend', svg); return scene.lastElementChild; }
// a positioned object; its inner .a group is what CSS animations move
const obj = (x, y, s, inner, cls = '') => `<g transform="translate(${x} ${y}) scale(${s})"><g class="a ${cls}">${inner}</g></g>`;
const inner = (el) => el.querySelector('.a');
const MOVES = ['popin', 'bounce', 'wiggle', 'shake'];   // animations of the whole object; only one can run at a time
function restart(el, cls) { el.classList.remove(cls, ...(MOVES.includes(cls) ? MOVES : [])); void el.getBoundingClientRect(); el.classList.add(cls); }
function tween(ms, fn, ease = easeOut) {
  return new Promise((res) => {
    const t0 = performance.now();
    const step = (now) => { const t = Math.min(1, (now - t0) / ms); fn(ease(t)); if (t < 1) requestAnimationFrame(step); else res(); };
    requestAnimationFrame(step);
  });
}
function svgPoint(e) { const p = scene.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(scene.getScreenCTM().inverse()); }
function tap(el, fn) { el.classList.add('tap'); on(el, 'click', fn); return el; }

/* ============================================================
   Sound: ElevenLabs clips from assets/, with synthesized sounds
   and the device voice as fallback (e.g. on file://)
   ============================================================ */
const VOICE_VOL = 1;
const CLIP_VOL = 0.7;
const CLIP_TRIM = {           // per-clip level trims, measured so the effects sit near the voice's loudness
  'sfx-honk': 0.3, 'sfx-drill': 0.36, 'sfx-cheer': 0.45, 'sfx-crane': 0.55, 'sfx-saw': 0.58, 'sfx-roof': 0.8,
  'sfx-water': 1.35, 'sfx-pour': 1.8, 'sfx-click': 3,
};
const CLIPS = [...Object.keys(LINES).map((k) => 'say-' + k), ...SFX.map((k) => 'sfx-' + k)];
const sfx = (() => {
  let ac = null, out = null, noiseBuf = null, voice = null, endVoice = null, muted = store.get('muted', false), ready = null;
  const raw = {}, clips = {};   // fetched bytes start loading now; decoding needs the AudioContext from the first tap
  for (const n of CLIPS) raw[n] = fetch(`assets/${n}.mp3?v=${ASSET_V}`).then((r) => (r.ok ? r.arrayBuffer() : null)).catch(() => null);
  function init() {   // call from a tap; resolves when the clips are decoded (or after a short wait)
    if (ac) { if (ac.state === 'suspended') ac.resume(); return ready; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return Promise.resolve();
    ac = new AC(); out = ac.createGain(); out.gain.value = muted ? 0 : 0.8; out.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const all = CLIPS.map((n) => raw[n].then((b) => b && new Promise((res, rej) => ac.decodeAudioData(b, res, rej)))
      .then((buf) => { if (buf) clips[n] = buf; }).catch(() => {}));
    ready = Promise.race([Promise.all(all), wait(2500)]);
    return ready;
  }
  function clip(name, vol = CLIP_VOL) {   // plays a loaded clip; null if it isn't loaded so the caller can fall back
    const buf = clips[name]; if (!ac || !buf) return null;
    const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = buf; g.gain.value = vol * (CLIP_TRIM[name] ?? 1);
    s.connect(g).connect(out); s.start(); return s;
  }
  function tone(f0, f1, dur, type = 'sine', vol = 0.3, delay = 0) {
    if (!ac) return; const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type;
    o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = o;
    if (type === 'sawtooth' || type === 'square') { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2000; o.connect(f); node = f; }
    node.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, f0, f1, ftype = 'lowpass', delay = 0, q = 1) {
    if (!ac) return; const t = ac.currentTime + delay;
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = ftype; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(out); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }
  // synthesized stand-ins; each returns its length in seconds
  const SYN = {
    hammer() { [0, 0.28].forEach((d) => { tone(240, 90, 0.14, 'square', 0.22, d); noise(0.08, 0.4, 3500, 900, 'bandpass', d); }); return 0.5; },
    saw() { [0, 0.22, 0.44, 0.66].forEach((d, i) => noise(0.18, 0.35, i % 2 ? 2600 : 1800, i % 2 ? 1800 : 2600, 'bandpass', d, 3)); return 0.85; },
    drill() { tone(160, 420, 0.5, 'sawtooth', 0.12); tone(420, 380, 0.4, 'sawtooth', 0.12, 0.5); noise(0.9, 0.1, 3000, 2500, 'bandpass', 0, 2); return 0.9; },
    digger() { noise(0.9, 0.45, 500, 150); tone(70, 95, 0.9, 'sawtooth', 0.16); return 0.9; },
    pour() { noise(1.5, 0.35, 900, 250); tone(90, 70, 1.4, 'sine', 0.2); return 1.5; },
    honk() { tone(392, 392, 0.17, 'square', 0.16); tone(494, 494, 0.17, 'square', 0.1); tone(392, 392, 0.26, 'square', 0.16, 0.25); tone(494, 494, 0.26, 'square', 0.1, 0.25); return 0.55; },
    crane() { tone(110, 260, 1.1, 'sawtooth', 0.1); noise(1.1, 0.12, 1500, 2500, 'bandpass', 0, 2); return 1.1; },
    brick() { tone(170, 70, 0.16, 'sine', 0.5); noise(0.08, 0.3, 1400, 300); return 0.2; },
    roof() { tone(140, 50, 0.3, 'sine', 0.55); noise(0.25, 0.4, 900, 120); return 0.35; },
    click() { tone(2200, 1600, 0.03, 'square', 0.18); tone(120, 120, 0.4, 'sine', 0.05, 0.04); return 0.4; },
    water() { noise(1.3, 0.3, 2600, 1400, 'bandpass', 0, 1.2); return 1.3; },
    cheer() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.22, 'triangle', 0.25, i * 0.12)); tone(1047, 1047, 0.8, 'triangle', 0.2, 0.5); return 1.2; },
    pop() { tone(480, 920, 0.12, 'sine', 0.35); tone(1400, 1500, 0.06, 'triangle', 0.08, 0.03); return 0.15; },
    sparkle() { [1568, 1976, 2349, 3136].forEach((f, i) => tone(f, f * 1.02, 0.18, 'sine', 0.12, i * 0.06)); return 0.4; },
    boop() { tone(330, 220, 0.18, 'triangle', 0.25); return 0.2; },
    zip() { tone(700, 1900, 0.28, 'triangle', 0.12); noise(0.28, 0.12, 4000, 6000, 'highpass'); return 0.3; },
    bloop() { tone(500, 900, 0.12, 'sine', 0.25); tone(900, 600, 0.14, 'sine', 0.18, 0.12); return 0.3; },
  };
  function hush() {   // stop the voice that is talking, if any
    try { speechSynthesis.cancel(); } catch {}
    if (voice) { try { voice.onended = null; voice.stop(); } catch {} voice = null; }
    if (endVoice) { const e = endVoice; endVoice = null; e(); }
  }
  return {
    init, hush,
    get muted() { return muted; },
    toggle() { muted = !muted; store.set('muted', muted); if (out) out.gain.value = muted ? 0 : 0.8; if (muted) hush(); return muted; },
    // a sound effect: the clip if there is one, else the synthesized version. Resolves near its end.
    fx(name) {
      const s = clip('sfx-' + name);
      const dur = s ? s.buffer.duration : (SYN[name] ? SYN[name]() : 0.2);
      return wait(dur * 750);
    },
    // a spoken line: the recorded clip, else the device voice reads the text. Resolves when it has finished.
    say(text, name) {
      hush();
      return new Promise((resolve) => {
        let timer = 0;
        const end = () => { clearTimeout(timer); if (endVoice === end) endVoice = null; resolve(); };
        endVoice = end;
        if (muted || !ac) { timer = setTimeout(end, 600 + text.length * 55); return; }
        timer = setTimeout(end, 2000 + text.length * 110);   // in case the voice never reports its end
        if ((voice = clip(name, VOICE_VOL))) { voice.onended = end; return; }
        const ss = window.speechSynthesis; if (!ss) { clearTimeout(timer); timer = setTimeout(end, 600 + text.length * 55); return; }
        try {
          const u = new SpeechSynthesisUtterance(text);
          const en = ss.getVoices().filter((v) => /^en/i.test(v.lang));
          u.voice = en.find((v) => /female|samantha|zira|aria|jenny|google us/i.test(v.name)) || en[0] || null;
          u.lang = 'en-US'; u.rate = 0.95; u.pitch = 1.3; u.onend = end; u.onerror = end;
          ss.speak(u);
        } catch { end(); }
      });
    },
  };
})();
try { speechSynthesis.getVoices(); } catch {}   // some browsers load the voice list lazily

/* ============================================================
   Narration: one thing talks at a time. Starting a new act
   cancels the one before it (it stops at its next step).
   ============================================================ */
let token = 0;
function speak(key) { cap.textContent = LINES[key]; return sfx.say(LINES[key], 'say-' + key); }
async function act(...steps) {
  const my = ++token;
  for (const s of steps) { if (my !== token) return false; await s(); }
  return my === token;
}
const narrate = (keys) => act(...keys.map((k) => () => speak(k)));

  return `<rect x="-44" y="-18" width="88" height="18" rx="3" fill="#9e9e9e"/>

  const el = put(`<g transform="translate(${x} ${y})" pointer-events="none">${Array.from({ length: 8 }, (_, i) => { const a = i * Math.PI / 4;

}
function confetti(n = 80) {

}

        await act(() => speak(q.safe ? 'yes' : 'no'), () => wait(QUIZ_PAUSE));
        if (!alive(id)) return;
        qi++; busy = false;
        if (qi < Q.length) { showQ(); lines = [Q[qi].k]; act(() => speak(Q[qi].k)); }
        else { lines = ['p12']; done(); sfx.fx('cheer'); confetti(50); }
      });
    };
    btn(190, '👍', '#43b05c', true); btn(410, '👎', '#ff8a1f', false);
  } },

  /* ---- 13. How do I become a builder? ---- */
  { lines: ['p13a', 'p13b', 'p13c'], build() {
    put(backdrop(470));
    const cards = [];
    [[14, 'p13a'], [210, 'p13b'], [406, 'p13c']].forEach(([x, k], i) => {
      const c = put(`<g class="tap"><rect class="panelcard" x="${x}" y="110" width="180" height="340" rx="22" fill="#fff" stroke="#ffd7a8" stroke-width="6"/></g>`);
      on(c, 'click', () => { cards.forEach((cc) => cc.querySelector('rect').classList.toggle('on', cc === c)); act(() => speak(k)); });
      cards.push(c);
      if (i < 2) put(`<path d="M${x + 184} 280 l12 0 m-6 -8 l8 8 l-8 8" stroke="#ff8a1f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);
    });
    cards[0].insertAdjacentHTML('beforeend', `${obj(76, 436, 0.62, person({}))}
      ${[['#e53935', 0], ['#1e88e5', 1], ['#fdd835', 2]].map(([c, r]) => `<rect x="${126 + (r % 2) * 6}" y="${404 - r * 30}" width="30" height="30" rx="4" fill="${c}" stroke="rgba(0,0,0,.2)" stroke-width="2"/>`).join('')}
      <rect x="28" y="160" width="140" height="16" rx="3" fill="#fff176" stroke="#c9a400" stroke-width="2"/>
      ${[0, 1, 2, 3, 4, 5, 6].map((i) => `<line x1="${38 + i * 20}" y1="160" x2="${38 + i * 20}" y2="${i % 2 ? 168 : 172}" stroke="#555" stroke-width="2"/>`).join('')}`);
    cards[1].insertAdjacentHTML('beforeend', `<rect x="234" y="${436 - 0.6 * 72 - 14}" width="132" height="12" rx="3" fill="#b9773b"/>
      ${obj(256, 436, 0.6, person({ hat: true, vest: true, boots: true, gloves: true }))}
      ${obj(344, 436, 0.6, person({ skin: '#8d5524', hair: '#2b1a10', shirt: '#43a047', hat: true, hatColor: '#fff', vest: true, boots: true, gloves: true }))}`);
    cards[2].insertAdjacentHTML('beforeend', `<text x="496" y="152" font-size="21" text-anchor="middle" class="title" style="stroke-width:5px">BUILDER</text>
      <text x="496" y="176" font-size="21" text-anchor="middle" class="title" style="stroke-width:5px">SCHOOL</text>
      ${obj(456, 438, 0.82, person({ hat: true, vest: true, boots: true }))}
      ${obj(542, 438, 0.86, person({ skin: '#d7a07a', hair: '#bdbdbd', shirt: '#6d4c41', pants: '#3e2723', hat: true, hatColor: '#fff', prop: 'clipboard' }))}`);
    // light up each card while its line is read
    const id = showId;
    const hl = (i) => () => { if (alive(id)) cards.forEach((c, j) => c.querySelector('rect').classList.toggle('on', i === j)); };
    PAGES[12].steps = ['p13a', 'p13b', 'p13c'].map((k, i) => [hl(i), k]);
  } },

  /* ---- 14. You did it! ---- */
  { lines: ['p14', 'badge'], build() {
    put(backdrop(400));
    put(house({ colour: state.colour && COLOURS[state.colour] }));
    scene.querySelectorAll('.glow').forEach((g) => g.setAttribute('opacity', 0.55)); ['#win1', '#win2'].forEach((w) => scene.querySelector(w).setAttribute('fill', '#fff59d'));
    put(`<g>${flowers()}</g>`);
    const sam = put(obj(525, 575, 0.72, person({ hat: true, vest: true, boots: true, gloves: true, wave: true })));
    tap(sam, () => { restart(inner(sam), 'waving'); act(() => speak('hello')); });
    const badge = put(`<g transform="translate(92 150)" display="none"><g class="a mid popin">
      <path d="M-30 40 L-44 110 L-20 96 L-8 120 L4 50 Z M30 40 L44 110 L20 96 L8 120 L-4 50 Z" fill="#e53935"/>
      <circle r="66" fill="#ffcc00" stroke="#e0a800" stroke-width="7"/><circle r="52" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 6"/>
      <path transform="translate(0 -18) scale(1.6)" d="${STAR}" fill="#fff"/>
      <text y="22" font-size="17" text-anchor="middle" font-family="'Luckiest Guy', sans-serif" fill="#2a2140">JUNIOR</text>
      <text y="42" font-size="17" text-anchor="middle" font-family="'Luckiest Guy', sans-serif" fill="#2a2140">BUILDER</text></g></g>`);
    put(`<text x="300" y="594" font-size="13" text-anchor="middle" font-family="Verdana" fill="rgba(0,0,0,.45)">Voices and sounds: elevenlabs.io</text>`);
    const id = showId;
    PAGES[13].steps = [[() => { if (alive(id)) { confetti(); sfx.fx('cheer'); } }, 'p14'],
      [() => { if (alive(id)) { badge.removeAttribute('display'); sfx.fx('sparkle'); } }, 'badge']];
  } },
];

/* ============================================================
   Page turning
   ============================================================ */
const dots = $('#dots');
dots.innerHTML = PAGES.map(() => '<i></i>').join('');
const seen = new Set();
function show(i, { silent = false } = {}) {
  pageCtl.abort(); pageCtl = new AbortController();
  page = i; const p = PAGES[i], id = ++showId;
  token++; sfx.hush();
  scene.innerHTML = ''; $('#fx').innerHTML = ''; nextBtn.classList.remove('ready');
  lines = p.lines.slice(); p.steps = null;
  cap.textContent = LINES[lines[0]];
  p.build();
  seen.add(i);
  [...dots.children].forEach((d, j) => { d.className = j === i ? 'now' : seen.has(j) ? 'seen' : ''; });
  prevBtn.disabled = i === 0;
  nextBtn.classList.toggle('last', i === PAGES.length - 1);
  nextBtn.setAttribute('aria-label', i === PAGES.length - 1 ? 'Play again' : 'Next');
  if (!silent) intro().then(() => { if (alive(id) && !p.need) done(); });
}
function intro() {   // the page's narration; some pages run a little action before each line
  const p = PAGES[page];
  if (p.steps && lines.join() === p.lines.join()) return act(...p.steps.flatMap(([fn, k]) => [async () => fn(), () => speak(k)]));
  return narrate(lines);
}
function next() {
  sfx.init();
  if (page === PAGES.length - 1) { state.colour = null; seen.clear(); show(0); } else show(page + 1);
}
nextBtn.addEventListener('click', next);
prevBtn.addEventListener('click', () => { sfx.init(); if (page > 0) show(page - 1); });
$('#hear').addEventListener('click', () => { sfx.init(); intro(); });
document.addEventListener('keydown', (e) => {
  if ($('#start').hidden === false) return;
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft' && page > 0) show(page - 1);
});
const muteBtn = $('#mute');
const drawMute = () => { muteBtn.textContent = sfx.muted ? '🔇' : '🔈'; };
drawMute();
muteBtn.addEventListener('click', () => { sfx.init(); sfx.toggle(); drawMute(); });

$('#go').addEventListener('click', async () => {
  $('#go').disabled = true;
  await sfx.init();
  $('#start').hidden = true;
  intro().then(() => { if (page === 0) done(); });
});
show(0, { silent: true });
window.__builder = { show, PAGES, LINES, state, get page() { return page; } };   // handy for debugging in the console
</script>

// Offline support: sw.js caches this page. Once the page has loaded, send it every file the page used (fonts,

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
    const send = () => reg.active && reg.active.postMessage({ cache: [location.href, ...performance.getEntriesByType('resource').map((r) => r.name)] });
    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
}
</script>
